# 给 Gradle 多留点内存，Loom 处理 Minecraft 时比较吃内存。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Fabric / Minecraft 26.3 工具链
#
# 注意：26.3 起 Minecraft 官方已不再混淆，Fabric 也停止维护 Yarn，
# 所以这里没有 mappings / yarn_mappings 配置项，这是正常的，不要加回去。
# ---------------------------------------------------------------------------
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2
fabric_api_version=0.161.0+26.3

# 可选的软依赖（界面上用，缺失时 mod 仍能运行）
cloth_config_version=26.3.159
modmenu_version=21.0.0

# ---------------------------------------------------------------------------
# Mod 自身信息
# ---------------------------------------------------------------------------
mod_version=1.0.0
maven_group=dev.mccb
archives_base_name=mccloudbackup
